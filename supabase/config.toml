# The claude function checks the caller's login itself (supabase.auth.getUser),
# so the gateway's legacy JWT check is off. This is needed with the new
# publishable/secret API keys and JWT signing keys.
[functions.claude]
verify_jwt = false

# The weekly digest is called by a Supabase Cron job, not a login. It checks the
# x-digest-secret header against the DIGEST_SECRET secret itself.
[functions.digest]
verify_jwt = false

# The comps function checks the caller's login itself (any CEO or Corp Dev login),
# like the claude function. Kensho credentials stay in its secrets.
[functions.comps]
verify_jwt = false

[functions.comps-chat]
verify_jwt = false

# The league table (Banker CRM) checks the caller's login itself, like comps, and uses the same Kensho secrets.
[functions.league]
verify_jwt = false
