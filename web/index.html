      icsNextStep({...d, nextStep:val("f_nextStep")||d.nextStep, nextStepDate:val("f_nextStepDate"), codename:val("f_codename")||d.codename, lead:val("f_lead")||d.lead}); break; }
    case "ics-call": { const r=S.comps&&S.comps.data&&S.comps.data.companies.find(c=>c.ticker===t.dataset.t); if(!r||!r.nextCall) return;
      icsSave({uid:"call-"+r.ticker+"-"+r.nextCall.date.slice(0,10), title:r.nextCall.name||`${r.name} earnings call`, start:r.nextCall.date, mins:60,
        desc:`${r.name} (${r.ticker}) earnings call. Date from S&P Global via Kensho; check the company's investor relations page for dial-in details.`}, `${r.ticker} earnings call ${r.nextCall.date.slice(0,10)}`); break; }
    case "tc-more": S.tc.more=!S.tc.more; tcRender(); break;
    case "mail-firm": mailFirm(t.dataset.firm); break;
    case "open-mate": e.preventDefault(); history.replaceState(null,"","#banker/"+encodeURIComponent(id)); S.lastFocusId=id; openRoute({kind:"banker",id}); break;
    case "fold": { const k=t.dataset.k; const open=!firmOpen(k); setFold(k,open); render();
      document.querySelector(`.fold[data-k="${CSS.escape(k)}"]`)?.focus(); break; }
    case "fold-all": { const open=t.dataset.open==="1"; firmKeysShown().forEach(k=>loadFolds()[k]=open); saveFolds(); render(); document.querySelector('[data-act="fold-all"]')?.focus(); break; }
    case "ceo-track": setCeoTrack(t.dataset.v); render(); break;
    case "comps-refresh": loadComps(true); render(); break;
    case "comps-period": setCompsPeriod(t.dataset.v); render(); break;
    case "cs-defaults": { const ta=document.getElementById("cs_peers"); if(ta) ta.value=DEFAULT_PEERS.join("\n"); break; }
    case "comps-settings": if(!canEditNow()) return; S.lastFocusEl=t; S.drawer={kind:"comps-settings"}; renderDrawer(); break;
    case "comps-save": t.disabled=true; await saveCompsSettings(); if(t.isConnected) t.disabled=false; break;
    case "csort": setSort("c",t.dataset.k); break;
    case "team-closed": S.teamClosed=!S.teamClosed; render(); document.querySelector('[data-act="team-closed"]')?.focus(); break;
    case "bgroup": S.bgroup = S.bgroup===false; render(); document.querySelector('[data-act="bgroup"]')?.focus(); break;
    case "import-open": if(!canEditNow()) return; S.lastFocusEl=t; S.drawer={kind:"import"}; renderDrawer(); break;
    case "im-preview": importPreview(); break;
    case "im-save": t.disabled=true; await importSave(); if(t.isConnected) t.disabled=false; break;
    case "add-link": readLinks(); S.drawer.links.push({label:"",url:"",type:"other"}); document.getElementById("linkRows").innerHTML=linkRowsHTML(S.drawer.links); break;
    case "rm-link": readLinks(); S.drawer.links.splice(+t.dataset.i,1); document.getElementById("linkRows").innerHTML=linkRowsHTML(S.drawer.links); break;
    case "save-deal": t.disabled=true; await saveDeal(); t.disabled=false; break;
    case "del-deal": case "del-banker": S.drawer.confirmDelete=true; rerenderDrawer(); break;
    case "del-deal-no": S.drawer.confirmDelete=false; rerenderDrawer(); break;
    case "del-deal-yes": await deleteDeal(S.drawer.id); break;
    case "del-banker-yes": await deleteBanker(S.drawer.id); break;
    case "save-banker": t.disabled=true; await saveBanker(); t.disabled=false; break;
    case "cf-pick": { const c=S.drawer&&S.drawer.conflicts&&S.drawer.conflicts[+t.dataset.i]; if(c){ c.choice=t.dataset.c; renderDrAlert(); } break; }
    case "gone-recreate": t.disabled=true; await recreateRecord(); t.disabled=false; break;
    case "add-note": { const txt=val("n_text"); if(!txt){ toast("Write the note first."); return; } t.disabled=true;
      const dr=S.drawer; if(await addNote({kind:dr.kind,id:dr.id}, val("n_kind"), txt)){ document.getElementById("n_text").value="";
        syncLastContact(dr); }
      t.disabled=false; break; }
    case "del-note": if(S.drawer.confirmNote===id){ S.drawer.confirmNote=null; await guard(()=>S.db.collection("notes").doc(id).delete(),"Note deleted"); } else { S.drawer.confirmNote=id; refreshNotes(); } break;
    case "export": exportCSV(); break;
    case "board-pack": t.disabled=true; try{ await exportBoardPack(); }catch(err){ toast("Couldn't build the board pack: "+((err&&err.message)||"unknown error")); } t.disabled=false; break;
    case "print": window.print(); break;
    case "ai-open": S.ai.open=true; renderAI(); document.getElementById("aiInput")?.focus(); break;
    case "ai-close": S.ai.open=false; renderAI(); break;
    case "ai-clear": if(S.ai.ctrl) S.ai.ctrl.abort(); S.ai.msgs=[]; S.ai.api=[]; renderAI(); break;
    case "ai-stop": if(S.ai.ctrl) S.ai.ctrl.abort(); break;
    case "ai-suggest": askAI(t.textContent); break;
    case "p-apply": t.disabled=true; await applyProposal(id); break;
    case "p-discard": S.proposals[id].status="discarded"; renderAI(); break;
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Tab" && S.drawer){
    const d=document.querySelector("#drawerRoot .drawer"); const ai=document.querySelector("#aiRoot .ai"), cp=document.querySelector("#cpRoot .ai");
    if(d && !(ai && ai.contains(document.activeElement)) && !(cp && cp.contains(document.activeElement))){
      const f=[...d.querySelectorAll('a[href],button:not([disabled]),input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
      if(f.length){ const first=f[0], last=f[f.length-1];
        if(!d.contains(document.activeElement)){ e.preventDefault(); (e.shiftKey?last:first).focus(); }
        else if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } }
    }
  }
  if(e.key==="Escape" && S.menuOpen){ setMenu(false); document.getElementById("whoDot").focus(); return; }
  if(e.key==="Escape"){ if(S.drawer) closeDrawer(); else if(S.ai.open){ S.ai.open=false; renderAI(); } else if(S.cp.open){ S.cp.open=false; renderCP(); document.getElementById("copilotBtn")?.focus(); } }
  if(e.key==="Enter" && e.target.matches("tr.click, li.click")) e.target.click();
  if(e.key==="Enter" && e.target.id==="aiInput" && !e.shiftKey){ e.preventDefault(); const v=e.target.value; e.target.value=""; askAI(v); }
  if(e.key==="Enter" && e.target.id==="cpInput" && !e.shiftKey){ e.preventDefault(); cpSubmit(); }
});
document.addEventListener("submit", e=>{ e.preventDefault();
  if(e.target.id==="loginForm"){ doLogin(); return; }
  if(e.target.id==="pwForm"){ savePassword(); return; }
  if(e.target.id==="aiForm"){ const i=document.getElementById("aiInput"); const v=i.value; i.value=""; askAI(v); return; }
  if(e.target.id==="cpForm") cpSubmit(); });
document.addEventListener("input", e=>{
  if(["f_ev","f_equity","f_netIncome"].includes(e.target.id)){ const el=document.getElementById("f_multiples"); if(el) el.textContent=multiplesLine({ev:val("f_ev"),equity:val("f_equity"),netIncome:val("f_netIncome")}); }
  if(e.target.id==="b_email"){ const el=document.getElementById("mailTo"); const v=e.target.value.trim(); if(el) el.innerHTML = isEmail(v) ? `To: <a href="mailto:${esc(v)}">${esc(v)}</a>` : `<span class="t2">No email address yet. Add it under Contact above, then write here.</span>`; }
  if(e.target.id==="q"){ S.q=e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById("q"); n.focus(); n.setSelectionRange(pos,pos); }
  if(e.target.id==="bq"){ S.bq=e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById("bq"); n.value=S.bq; n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener("change", e=>{
  if(e.target.id==="im_file"){ importFile(e.target); return; }
  if(e.target.id==="cpWeb"){ S.cp.web=e.target.checked; return; }
  if(e.target.matches && e.target.matches("input[data-imi]")){ const p=S.drawer&&S.drawer.im&&S.drawer.im.people[+e.target.dataset.imi]; if(p){ p.take=e.target.checked; renderImportPreview(); } return; }
  if(e.target.id==="chgDays"){ S.chgDays=+e.target.value; S.changes=null; render(); document.getElementById("chgDays")?.focus(); return; }
  if(e.target.id==="f_type"){ const t=document.getElementById("f_track"); if(t && t.dataset.auto==="1") t.value=defaultTrack(e.target.value); }
  if(e.target.id==="f_track"){ e.target.dataset.auto="0"; }
  if(e.target.id==="f_stage"){ const st=e.target.value, box=document.getElementById("outcomeBox"); if(!box) return;
    const done=["Closed","Dead"].includes(st); box.hidden=!done; document.getElementById("reasonWrap").hidden = st!=="Dead";
    const od=document.getElementById("f_outcomeDate"); if(done && od && !od.value) od.value=TODAY(); }
});

/* ---------- data: Supabase tables (id text, doc jsonb) behind a small collection/doc API ---------- */
const TABLES = ["deals","bankers","notes"];
function makeDb(sb){
  return { collection(table){ return { doc(id){ return {
    async set(body){ const {error}=await sb.from(table).upsert({id, doc:body}); if(error) throw error; await refetch(table); },
    async update(patch){ await casWrite(table, id, row=>{ const doc={...(row.doc||{}), ...patch};
      if(table==="deals" && patch.stage && patch.stage!==(row.doc||{}).stage) doc.stageSince=Date.now(); return {doc}; }); },
    async delete(){ const {data, error}=await sb.from(table).delete().eq("id", id).select("id"); if(error) throw error; if(!data||!data.length) throw {code:"denied"}; await refetch(table); }
  }; } }; } };
}
async function refetch(table){
  let q=S.sb.from(table).select("id,doc,updated_at,updated_by");
  if(table==="notes") q=q.order("updated_at",{ascending:false}).limit(1000);
  const {data, error}=await q;
  if(error){ if(!S.loaded[table]) toast("Couldn't load the tracker: "+error.message); return; }
  S[table]=(data||[]).map(r=>({...(r.doc||{}), id:r.id, _v:r.updated_at, _by:r.updated_by}));
  if(table==="deals") S.deals.forEach(normDeal);
  if(table==="deals"||table==="bankers"){ if(S.changes && !S.changes.loading) S.changes=null; const hk=histKey(S.drawer); if(hk) setTimeout(()=>loadHistory(hk),0); }
  S.loaded[table]=true; if(table==="deals") clearTimeout(startData.timer);
  if(S.drawer && S.drawer.kind==="view-deal") S.drawer.rendered=false;
  render();
  if(S.pendingRoute && S.loaded[S.pendingRoute.kind==="deal"?"deals":"bankers"]) openRoute(S.pendingRoute);
}
const refetchSoon = (()=>{ const t={}; return table=>{ clearTimeout(t[table]); t[table]=setTimeout(()=>refetch(table),250); }; })();
async function loadProfiles(){
  const {data}=await S.sb.from("profiles").select("id,display_name,username,role");
  (data||[]).forEach(p=>{ S.profiles[p.id]={name:p.display_name, username:p.username||"", role:p.role||""}; });
}
/* "Also editing" notice: Realtime presence, one entry per open tab */
const TAB_ID=uid();
function startPresence(){
  if(S.presence || !S.sb || !S.sb.channel) return;
  const ch=S.sb.channel("deal-desk-presence",{config:{presence:{key:TAB_ID}}});
  ch.on("presence",{event:"sync"},()=>{ S.others=Object.values(ch.presenceState()||{}).flat(); renderPresence(); });
  ch.subscribe(st=>{ if(st==="SUBSCRIBED"){ S.presenceReady=true; trackPresence(); } });
  S.presence=ch;
}
function trackPresence(){ if(!S.presence||!S.presenceReady||!S.session) return; Promise.resolve().then(()=>S.presence&&S.presence.track({id:S.meId, name:S.session.name, editing:S.editing||null})).catch(()=>{}); }
function setEditing(key){ key=key||null; if(S.editing===key) return; S.editing=key; trackPresence(); }
function stopPresence(){
  const ch=S.presence; S.presence=null; S.presenceReady=false; S.others=[]; S.editing=null;
  if(ch){ Promise.resolve().then(()=>ch.untrack()).catch(()=>{}).finally(()=>{ try{ S.sb.removeChannel(ch); }catch{} }); }
}
function renderPresence(){
  const el=document.getElementById("drPresence"); const dr=S.drawer; if(!el) return;
  const key = dr && dr.id && (dr.kind==="deal"||dr.kind==="banker") ? dr.kind+":"+dr.id : null;
  const names = key ? [...new Set((S.others||[]).filter(p=>p.editing===key && p.id!==S.meId).map(p=>p.name||"A teammate"))] : [];
  el.textContent = names.length ? `${names.join(" and ")} ${names.length>1?"are":"is"} editing this ${dr.kind}` : "";
}
function startData(){
  if(S.started) return; S.started=true;
  startPresence();
  startData.timer=setTimeout(()=>{ S.stale=true; render(); }, 10000);
  loadProfiles().then(render); loadSettings();
  TABLES.forEach(refetch);
  let ch=S.sb.channel("deal-desk");
  TABLES.forEach(t=>{ ch=ch.on("postgres_changes",{event:"*",schema:"public",table:t},()=>refetchSoon(t)); });
  S.channel=ch.subscribe();
}
function stopData(){
  if(S.channel){ S.sb.removeChannel(S.channel); S.channel=null; }
  stopPresence(); S.hist={}; S.changes=null;
  S.started=false; TABLES.forEach(t=>{ S[t]=[]; S.loaded[t]=false; });
}

/* ---------- auth: Supabase email/password; usernames map to <username>@<usernameDomain> ---------- */
function toEmail(u){ u=u.trim().toLowerCase(); return u.includes("@") ? u : u+"@"+(CFG.usernameDomain||"deal-desk.local"); }
async function onSignedIn(session){
  S.meId=session.user.id;
  const {data, error}=await S.sb.from("profiles").select("username,display_name,role").eq("id", session.user.id).maybeSingle();
  if(error || !data){ await S.sb.auth.signOut(); S.session=null; S.loginErr="This login has no tracker role yet. Ask the tracker owner to set it up."; render(); return; }
  S.session={username:data.username, name:data.display_name||data.username, role:data.role};
  S.me={name:S.session.name}; S.writeLocked=false;
  S.sample = data.role==="corpdev"; S.toolsOk=true;
  const dot=document.getElementById("whoDot"); dot.hidden=false; dot.textContent=S.session.name.trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
  startData(); route();
}
async function doLogin(){
  if(S.loginBusy) return;
  const u=(document.getElementById("li_user")?.value||"").trim(), pw=document.getElementById("li_pw")?.value||"";
  if(!u||!pw){ S.loginErr="Enter your username and password."; render(); return; }
  S.loginBusy=true; S.loginErr=""; render();
  const {data, error}=await S.sb.auth.signInWithPassword({email:toEmail(u), password:pw});
  S.loginBusy=false;
  if(error || !data.session){
    const m=(error&&error.message)||"No session returned";
    S.loginErr = /rate|too many/i.test(m) ? "Too many attempts. Wait a few minutes and try again."
      : (error && (error.code==="invalid_credentials" || /invalid login credentials/i.test(m))) ? "That username and password don't match. Check them, or ask the tracker owner to reset your password."
      : (error && error.code==="email_provider_disabled") ? "Sign-in is switched off in Supabase (Authentication > Sign In / Providers > Email). Tell the tracker owner."
      : "Sign-in failed: "+m+". The site's Supabase settings may be wrong; tell the tracker owner.";
    render(); const f=document.getElementById("li_pw"); if(f){ f.value=""; f.focus(); } return;
  }
  await onSignedIn(data.session);
}
async function signOut(){
  try{ await S.sb.auth.signOut(); }catch{}
  stopData(); S.session=null; S.drawer=null; S.ai.open=false; S.ai.msgs=[]; S.ai.api=[]; S.sample=null;
  if(S.cp.ctrl) S.cp.ctrl.abort(); if(S.cp.cancelSignIn) S.cp.cancelSignIn(); S.cp=cpFresh(); S.tc=tcFresh();
  document.getElementById("whoDot").hidden=true; history.replaceState(null,"",location.pathname); render();
}
function loginHTML(){
  const wrap = inner => `<div class="login" role="region" aria-label="Sign in">${inner}</div>`;
  if(S.configMissing) return wrap(`<h2>Not connected yet</h2><p>This site has no database settings. Add the SUPABASE_URL and SUPABASE_ANON_KEY repository variables and redeploy (see the README).</p>`);
  if(!S.authChecked) return wrap(`<h2>Deal desk</h2><p>Loading…</p>`);
  return wrap(`<div class="kicker">Corporate development</div><h2>Sign in to the deal desk</h2>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <label class="f">Username<input type="text" id="li_user" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="f">Password<input type="password" id="li_pw" autocomplete="current-password"></label>
      ${S.loginErr?`<p class="err" role="alert">${esc(S.loginErr)}</p>`:""}
      <div class="inline"><button class="btn primary" ${S.loginBusy?"disabled":""}>${S.loginBusy?"Signing in…":"Sign in"}</button></div>
    </form><p class="source">Forgot your password? Ask the tracker owner to reset it.</p>`);
}
async function boot(){
  route();
  if(!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase){ S.configMissing=true; render(); return; }
  S.sb=window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
  S.db=makeDb(S.sb);
  const {data:{session}}=await S.sb.auth.getSession();
  S.authChecked=true;
  if(session) await onSignedIn(session); else render();
  S.sb.auth.onAuthStateChange((event)=>{ if(event==="SIGNED_OUT" && S.session){ stopData(); S.session=null; S.loginErr="You were signed out. Sign in again."; render(); } });
}
boot();
</script>
