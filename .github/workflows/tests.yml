name: Tests

# Runs every test suite on each pull request (and on pushes to main), so a change that breaks the site
# or a Supabase function shows a red check before it is merged and published.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x

      - name: Run the tests
        run: npm test

      - name: Keep screenshots and board packs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: tests/out/
          retention-days: 7
